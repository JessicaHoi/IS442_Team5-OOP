# Used by tests annotated with @ActiveProfiles("test"): a private in-memory database per test context.
spring:
  datasource:
    url: jdbc:h2:mem:studybuddy-test;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

studybuddy:
  seed:
    enabled: false
  # Stays off even if backend/.env turns it on, so tests never reach a real bot.
  telegram:
    enabled: false
    # Tests send reminders themselves, so the timer can't interfere with them.
    reminder-check: 1h
