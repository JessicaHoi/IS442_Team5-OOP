# Temporary during Phases 1–8; restore port 8080 after Phase 8.
server:
  port: 9090

spring:
  application:
    name: studybuddy

  # --- Local secrets (backend/.env, gitignored). Used by the supabase profile. ---
  config:
    import: optional:file:.env[.properties]

  # --- Local development database (H2, stored in a file) ---
  # Run with the "supabase" profile to use Supabase instead (application-supabase.yaml).
  datasource:
    url: jdbc:h2:file:./data/studybuddy
    username: sa
    password: ""

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update
    # Entities are only read inside service transactions; a lazy load anywhere else fails fast instead of
    # quietly running extra queries.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Load lazy collections and associations for up to 50 parents in one query (avoids N+1 queries).
        default_batch_fetch_size: 50

  # --- H2 browser console ---
  h2:
    console:
      enabled: true
      path: /h2-console
# --- Study Buddy settings ---
studybuddy:
  app:
    # Where students open the app, used for links in calendar files. Blank leaves the links out.
    url: ${APP_URL:}
  auth:
    # How long a sign-in token stays valid. Tokens are held in memory, so a restart also signs everyone out.
    token-ttl: 12h
  telegram:
    # Optional. Off by default; see "Telegram (optional)" in the README. One bot per developer.
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    # Only one running instance may poll per bot token.
    polling: ${TELEGRAM_POLLING:true}
    poll-timeout: 50s
    link-token-ttl: 10m
  group:
    # Range a leader may choose for a group's maximum size (the front end uses the same limits).
    min-size: 2
    max-size: 20
  seed:
    # Load demo data into an empty database and add missing demo students to an existing local database.
    enabled: true
    add-students-to-existing: true
    location: classpath:seed/demo-data.json
    # Password for every demo account (local demo data only).
    demo-password: password
  matching:
    preview:
      # How many top matches each side of the admin strategy preview shows.
      size: 10
