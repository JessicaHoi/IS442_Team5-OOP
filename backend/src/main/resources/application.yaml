spring:
  application:
    name: studybuddy

  # --- Local secrets (backend/.env, gitignored). Used by the supabase profile. ---
  config:
    import: optional:file:.env[.properties]

  # --- Local development database (H2, stored in a file) ---
  # Run with the "supabase" profile to use Supabase instead (application-supabase.yaml).
  datasource:
    url: jdbc:h2:file:./data/studybuddy
    username: sa
    password: ""

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # --- H2 browser console ---
  h2:
    console:
      enabled: true
      path: /h2-console